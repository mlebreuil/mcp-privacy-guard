[project]
name = "mcp-privacy-guard"
version = "0.1.0"
description = "Pseudonymizes MCP tool results and questions before they reach the model provider"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcp-privacy-guard = "mcp_privacy_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_privacy_guard"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_privacy_guard/profiles" = "mcp_privacy_guard/profiles"
"src/mcp_privacy_guard/data" = "mcp_privacy_guard/data"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "leak: leak tests, the merge gate",
    "bench: performance budgets",
]
